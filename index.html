<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilha do Lico</title>
</head>
<body>
<p id="m" style="font-family:sans-serif;padding:2rem;text-align:center">Carregando o jogo…</p>
<script>
const base = "https://raw.githubusercontent.com/igoralcantara-lab/trilha-do-lico/main/";
Promise.all([0,1,2,3,4,5,6,7].map(i => fetch(base + "u" + i + ".txt").then(r => {
  if (!r.ok) throw new Error(String(r.status));
  return r.text();
}))).then(parts => {
  document.open();
  document.write(parts.join(""));
  document.close();
}).catch(() => {
  const m = document.getElementById("m");
  if (m) m.textContent = "Não carregou. Atualize a página.";
});
</script>
</body>
</html>
